<div class="blank-layout-container justify-center items-center bg-lightprimary">
  <div class="relative w-full h-full bg-gredient justify-center">
    <div class="h-full flex items-center sm:px-0 px-3">
      <mat-card class="cardWithShadow boxed-auth mb-0!">
        <mat-card-content class="p-32">
          <div class="text-center flex flex-col justify-center">
            <a [routerLink]="['/dashboard']" class="flex items-center justify-center">
              <img src="./assets/images/logos/dark-logo.svg" class="align-middle m-2" alt="logo" />
            </a>
            <div class="mt-8 text-center">Your Social Campaigns</div>

            <form class="mt-8">
              <mat-label class="mat-subtitle-2 text-sm font-semibold mb-3 block text-start">Username</mat-label>
              <mat-form-field appearance="outline" class="w-full" color="primary">
                <input matInput />
              </mat-form-field>
              <!-- password -->
              <mat-label class="mat-subtitle-2 text-sm font-semibold mb-3 block text-start">Password</mat-label>
              <mat-form-field appearance="outline" class="w-full" color="primary">
                <input matInput type="password" />
              </mat-form-field>

              <div class="flex items-center justify-between mb-3">
                <mat-checkbox color="primary">Remember this Device</mat-checkbox>
                <a [routerLink]="['/']" class="text-primary font-semibold no-underline m-l-auto text-sm">Forgot Password
                  ?</a>
              </div>
              <a [routerLink]="['/']" mat-flat-button color="primary" class="w-full">
                Sign In
              </a>
              <!-- input -->
            </form>
            <span class="block font-medium text-center mt-6">New to TailwindAdmin?
              <a [routerLink]="['/authentication/register']" class="no-underline text-primary font-medium text-sm">
                Create an account</a>
            </span>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
